<style>
/* Layout: one long scroll. Dark hero → white work grid → white about → rounded dark footer card.
   Project pages reuse the same nav + footer and stack flexible image/text blocks.
   Strictly black & white by design (single theme on purpose). */
:root{
  --ink:#111111;        /* dark grey, replaces pure black */
  --ink-2:#1d1d1d;      /* slightly lifted dark for hovers */
  --paper:#ffffff;
  --soft:#f3f3f3;       /* placeholder / pressed fills */
  --line:#e4e4e4;
  --muted:#6a6a6a;      /* secondary text on white (AA) */
  --muted-dark:#a8a8a8; /* secondary text on dark (AA) */
  --font:"Poppins", "Helvetica Neue", Arial, system-ui, sans-serif;
  --radius:16px;
  --radius-lg:24px;
  --nav-h:72px;
  --gutter:clamp(16px, 4vw, 48px);
  --maxw:1280px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 24px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
p{margin:0}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
.on-dark :focus-visible{outline-color:var(--paper)}

/* ---------- Button (from reference: white pill, ↗ becomes → on hover) ---------- */
.btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--paper);color:var(--ink);border:0;border-radius:999px;padding:.55rem 1.15rem;font:500 .95rem/1.2 var(--font);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .2s,transform .15s}
.btn svg{flex:none;transition:width .25s ease,opacity .2s ease,margin .25s ease}
.btn .i-in{width:14px;height:14px}
.btn .i-out{width:0;height:16px;opacity:0;margin-left:-.5rem}
.btn:hover .i-in{width:0;opacity:0;margin-right:-.5rem}
.btn:hover .i-out{width:16px;opacity:1;margin-left:0}
.btn:active{background:#e9e9e9;transform:scale(.97)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--paper)}
.btn--dark{background:var(--ink);color:var(--paper)}
.btn--dark:active{background:var(--ink-2)}
.btn--dark:focus-visible{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}

/* ---------- Nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:var(--paper)}
.nav .wrap{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{font-weight:700;font-size:1.35rem;letter-spacing:-.03em;text-decoration:none}
.nav-right{display:flex;align-items:center;gap:clamp(1.25rem,4vw,3.5rem)}
.nav-links{display:flex;gap:clamp(1.25rem,4vw,3.25rem);list-style:none;margin:0;padding:0}
.nav-links a{text-decoration:none;font-weight:500;font-size:.95rem;position:relative}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav-links a:hover::after{transform:scaleX(1)}
.burger{display:none;background:none;border:0;color:var(--paper);width:44px;height:44px;margin-right:-10px;cursor:pointer;align-items:center;justify-content:center}
.burger span,.burger span::before,.burger span::after{display:block;width:22px;height:1.8px;background:currentColor;position:relative;transition:transform .25s,background .2s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0}
.burger span::before{top:-7px}.burger span::after{top:7px}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] span::after{transform:translateY(-7px) rotate(-45deg)}
@media (max-width:760px){
  .burger{display:inline-flex}
  .nav-right{position:absolute;top:var(--nav-h);left:0;right:0;background:var(--ink);flex-direction:column;align-items:flex-start;gap:1.5rem;padding:1.25rem var(--gutter) 2rem;border-top:1px solid #2a2a2a}
  .nav-right[data-open="false"]{display:none}
  .nav-links{flex-direction:column;gap:1.1rem}
  .nav-links a{font-size:1.5rem;font-weight:500;letter-spacing:-.02em}
}

/* ---------- Hero ---------- */
.hero{background:var(--ink);color:var(--paper);min-height:calc(100svh - var(--nav-h));display:flex;flex-direction:column;justify-content:center;padding-block:clamp(3rem,8vh,6rem)}
.hero h1{font-size:clamp(2.5rem,17vw,11rem);white-space:nowrap;line-height:.88;letter-spacing:-.055em;font-weight:600}
/* name and intro read as title + subtitle: the box is as wide as the name, the intro fills ~95% of it */
.hero-title{width:fit-content;max-width:100%;margin-inline:auto;text-align:center}
.hero-intro{width:0;min-width:95%;margin:clamp(1.25rem,2.5vw,2rem) auto 0;font-size:clamp(.95rem,1.7vw,1.4rem);font-weight:300;line-height:1.5;color:#bdbdbd;text-wrap:pretty}
.hero-foot{margin-top:clamp(3rem,10vh,7rem);display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted-dark)}
.scroll-cue{display:inline-flex;align-items:center;gap:.75rem;text-decoration:none}
.scroll-cue i{display:block;width:1px;height:36px;background:#3a3a3a;position:relative;overflow:hidden}
.scroll-cue i::after{content:"";position:absolute;left:0;top:-40%;width:1px;height:40%;background:var(--paper);animation:cue 2.2s ease-in-out infinite}
@keyframes cue{to{top:100%}}

/* ---------- Sections ---------- */
.section{padding-block:clamp(5rem,11vw,9rem)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:clamp(2rem,5vw,3.5rem);flex-wrap:wrap}
.sec-head h2{font-size:clamp(2.4rem,6vw,4.75rem)}
.sec-head .count{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* Work grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(2.5rem,5vw,4.5rem) clamp(1.25rem,3vw,2.5rem)}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.card{text-decoration:none;display:flex;flex-direction:column;gap:1.1rem}
.card .media{border-radius:var(--radius);overflow:hidden;background:var(--soft);aspect-ratio:4/3}
.card .media img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .4s}
.card:hover .media img{transform:scale(1.035)}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.card h3{font-size:clamp(1.25rem,2vw,1.6rem);letter-spacing:-.025em}
.card .meta{color:var(--muted);font-size:.95rem;margin-top:.25rem}
.card .go{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .25s,color .25s,border-color .25s}
.card:hover .go{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card:focus-visible{outline-offset:8px;border-radius:var(--radius)}

/* About */
/* photo spans from the "About me" label to the last line of the bio; details sit below the text */
.about{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);column-gap:clamp(2rem,6vw,6rem);align-items:start}
.about .photo{grid-column:1;grid-row:1;align-self:stretch;border-radius:var(--radius);overflow:hidden;background:var(--soft);max-width:520px}
.about-text{grid-column:2;grid-row:1}
.about-facts{grid-column:2;grid-row:2}
.about .photo{position:relative}
.about .photo img{position:absolute;inset:0;aspect-ratio:auto!important}
@media (max-width:820px){.about .photo img{position:static}}
@media (max-width:820px){.about{grid-template-columns:1fr;row-gap:2rem}.about .photo,.about-text,.about-facts{grid-column:1;grid-row:auto}.about .photo{aspect-ratio:4/5;align-self:start}}
.about .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.about h2{font-size:clamp(2rem,4.2vw,3.4rem);margin-block:1rem 1.5rem}
.about .bio{display:grid;gap:1rem;font-size:1.05rem;color:#2c2c2c;text-align:justify;hyphens:auto}
.facts{margin:2.25rem 0 0;padding-top:1.75rem;border-top:1px solid var(--line);display:grid;grid-template-columns:min-content max-content;justify-content:space-between;gap:1.25rem 1.5rem}
.facts dt{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.nw{white-space:nowrap}
/* when the text column is narrow, stack the details so "What I do" keeps its two lines */
.about-facts{container-type:inline-size}
.facts dd{margin:.2rem 0 0;font-weight:500;font-size:.94rem}
/* two columns down to phone size; in tighter columns the text scales down so "What I do" keeps its two lines */
@container (max-width:440px){.facts{grid-template-columns:1fr}}
@container (min-width:441px){.facts dd.lines{white-space:nowrap}}
@container (min-width:441px) and (max-width:720px){.facts dd{font-size:min(.94rem,(100cqi - 1.5rem) / 38)}}

/* ---------- Footer card ---------- */
.footer-outer{padding:0 clamp(12px,2vw,24px) clamp(12px,2vw,24px)}
.footer{background:var(--ink);color:var(--paper);border-radius:var(--radius-lg);padding:clamp(4rem,10vw,7.5rem) var(--gutter) 2rem;text-align:center}
.footer h2{font-size:clamp(2.6rem,8vw,6rem);letter-spacing:-.05em}
.footer .btn{margin-top:1.75rem}
.contact-row{margin-top:clamp(4rem,10vw,7rem);display:flex;justify-content:space-around;gap:1.25rem 2rem;flex-wrap:wrap}
.contact-row a{text-decoration:none;font-weight:500;font-size:clamp(.95rem,1.4vw,1.1rem);overflow-wrap:anywhere;border-bottom:1px solid transparent;transition:border-color .2s}
.contact-row a:hover{border-color:currentColor}
.contact-item{display:flex;flex-direction:column;align-items:center;gap:.45rem;min-width:0}
.contact-item span{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-dark);font-weight:500}
.footer-base{margin-top:clamp(3.5rem,8vw,5.5rem);display:flex;flex-direction:column;align-items:center;gap:.6rem;font-size:.82rem;color:var(--muted-dark)}
.linkbtn{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:.25rem .5rem}
.linkbtn:hover{color:var(--paper)}
@media (max-width:640px){.contact-row{flex-direction:column;align-items:center}}

/* ---------- Project page ---------- */
.p-head{padding-block:clamp(4rem,9vw,7rem) clamp(2rem,4vw,3rem)}
.back{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--muted);font-size:.9rem;margin-bottom:2rem}
.back:hover{color:var(--ink)}
.p-title{text-align:center}
.p-head h1{font-size:clamp(2.8rem,8vw,6.5rem);letter-spacing:-.05em}
.p-desc{margin:1.25rem auto 0;font-size:clamp(1.05rem,1.6vw,1.25rem);max-width:none;color:#2c2c2c;line-height:1.5;text-wrap:balance}
.p-meta{margin:clamp(2.5rem,5vw,3.5rem) 0 0;padding-top:1.5rem;border-top:1px solid var(--line);display:grid;grid-template-columns:auto auto minmax(0,max-content);justify-content:space-between;gap:1.5rem 3rem}
/* first column starts at the left edge, last column ends at the right edge of the images */
@media (max-width:640px){.p-meta{grid-template-columns:1fr 1fr;justify-content:stretch}.p-meta div:last-child{grid-column:1/-1}.p-meta .nw{white-space:normal}}
.p-meta dt{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.p-meta dd{margin:.35rem 0 0;font-weight:500}
.blocks{display:grid;gap:clamp(3rem,7vw,6.5rem);padding-bottom:clamp(4rem,9vw,7rem)}
.fig{margin:0;display:grid;gap:.9rem}
.fig img{width:100%;height:auto;border-radius:var(--radius);background:var(--soft);object-fit:cover}
.fig img.plain{border-radius:0;background:none;object-fit:contain} /* drawings: no frame */
.fig figcaption,.cap{font-size:.9rem;color:var(--muted);max-width:60ch}
.b-text{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:1.25rem 2rem}
@media (max-width:720px){.b-text{grid-template-columns:1fr}}
.b-text h2{font-size:clamp(1.5rem,2.6vw,2.1rem);letter-spacing:-.03em;display:flex;gap:.75rem;align-items:baseline}
.b-text h2 .num{font-size:.9rem;font-weight:500;color:var(--muted);letter-spacing:0;font-variant-numeric:tabular-nums}
.b-text .body{display:grid;gap:1rem}
.b-text p{font-size:1.1rem;color:#2c2c2c;text-align:justify;hyphens:auto}
.b-text p.spec{text-align:left}
.b-text ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.1rem 1.5rem}
.b-text li{padding:.7rem 0;border-bottom:1px solid var(--line);font-weight:500;font-size:1rem}
.b-text li small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
@media (max-width:480px){.b-text ul{grid-template-columns:1fr}}
.b-text .spec{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
/* a pair marked tight sits right under the previous image, with the same gap as between the two pair images */
.blocks > .tight{margin-top:calc(clamp(.75rem,2vw,1.5rem) - clamp(3rem,7vw,6.5rem))}
.b-pair,.b-grid{display:grid;gap:clamp(.75rem,2vw,1.5rem)}
.b-pair{grid-template-columns:repeat(2,minmax(0,1fr))}
.b-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.b-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.b-grid,.b-grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.b-pair{grid-template-columns:1fr}}
.b-ti{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(1.5rem,5vw,5rem);align-items:center}
.b-ti.reverse .fig{order:2}
.b-ti h3{font-size:clamp(1.35rem,2.3vw,1.9rem);margin-bottom:.9rem;letter-spacing:-.03em}
.b-ti p{font-size:1.05rem;color:#2c2c2c;text-align:justify;hyphens:auto}
/* justified text leaves big gaps on narrow screens, so phones get left-aligned text */
@media (max-width:600px){.b-text p,.b-ti p,.about .bio{text-align:left;hyphens:manual}}
@media (max-width:760px){.b-ti{grid-template-columns:1fr}.b-ti.reverse .fig{order:0}}
.next{border-top:1px solid var(--line);padding-block:clamp(3.5rem,8vw,6rem)}
.next h2.more-title{font-size:clamp(2rem,4.5vw,3.25rem);margin-bottom:clamp(1.5rem,3vw,2.25rem)}
.more{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(.75rem,2vw,1.25rem)}
@media (max-width:640px){.more{grid-template-columns:1fr}}
.tile{position:relative;display:block;border-radius:var(--radius);overflow:hidden;aspect-ratio:7/5;background:var(--ink);text-decoration:none;isolation:isolate}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.tile::after{content:"";position:absolute;inset:0;background:rgba(17,17,17,.42);transition:background .3s;z-index:1}
.tile span{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:1.5rem;text-align:center;color:var(--paper);font-weight:600;font-size:clamp(1.4rem,2.8vw,2.1rem);line-height:1.15;letter-spacing:-.035em;text-wrap:balance}
.tile:hover img{transform:scale(1.04)}
.tile:hover::after{background:rgba(17,17,17,.55)}
.tile:focus-visible{outline-offset:4px}
.all-work{display:inline-block;margin-top:2rem;color:var(--muted);font-size:.95rem}
.all-work:hover{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--paper);color:var(--ink);font-size:.9rem;font-weight:500;padding:.65rem 1.1rem;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- Fade-in on scroll (only for items below the fold) ---------- */
.pre{opacity:0;transform:translateY(18px)}
.reveal{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:reduce){.pre{opacity:1;transform:none}.scroll-cue i::after{animation:none}}
</style>

      Connect
      <svg class="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

<script>
/* =====================================================================
   EDIT YOUR CONTENT HERE
   - Images: put a URL or file path in `src`. Leave it empty ("") to show a grey placeholder.
   - `ratio` sets the image shape ("16/9", "4/3", "1/1", "4/5"...).
   - Project blocks can be duplicated, deleted or reordered freely. Types:
       { type:"text",  title, text }
       { type:"full",  image, caption }
       { type:"pair",  images:[a,b], caption, tight:true }   // tight: sits close under the image above
       { type:"textImage", image, title, text, reverse:true/false }
       { type:"grid",  images:[a,b,c] or [a,b,c,d], caption }
   - Add a project by copying one object in PROJECTS. The slug becomes its URL (#slug).
   ===================================================================== */

const SITE = {
  name: "Sara Illana",
  intro: "Industrial and digital product designer in Copenhagen, combining creativity and engineering to translate user needs into intuitive, well\u2011crafted products.",
  email: "sara.illana.saez@gmail.com",
  phone: "+45 72 62 77 36",
  linkedin: "https://www.linkedin.com/in/sara-illana-saez",
  photo: { src: "img/about/sara.webp", alt: "Black and white portrait of Sara Illana smiling, outdoors among trees", ratio: "1095/1437" },
  aboutTitle: "I care about creating things that people genuinely enjoy using.",
  bio: [

document.documentElement.lang = "en"; // lets justified text hyphenate cleanly
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
// keep each " · " attached to the word before it, so a line never starts with a dot
const dots = v => {
  const t = String(v ?? "");
  // a "\n" in the text sets the line break by hand (used for "What I do")
  if (t.includes("\n")) return t.split("\n").map(l => esc(l).replace(/ · /g, "\u00a0· ")).join("<br>");
  return t.split(" · ").map(x => `<span class="nw">${esc(x)}</span>`).join("\u00a0· ");
};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TONES = ["#ececec", "#e2e2e2", "#d8d8d8", "#e6e6e6"];
let toneI = 0;

function placeholder(label, ratio) {
  const [rw, rh] = ratio.split("/").map(Number);
  const w = 1600, h = Math.round(1600 * rh / rw);
  const bg = TONES[toneI++ % TONES.length];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${w} ${h}'><rect width='100%' height='100%' fill='${bg}'/><text x='50%' y='50%' font-family='Poppins,Arial,sans-serif' font-size='${Math.round(w/40)}' fill='#8a8a8a' text-anchor='middle' dominant-baseline='middle'>${esc(label)}</text></svg>`;
  return { src: "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg), w, h };
}
function imgTag(o, eager = false) {
  const ratio = o.ratio || "16/9";
  const p = o.src ? null : placeholder(o.label || "Image", ratio);
  const [rw, rh] = ratio.split("/").map(Number);
  return `<img${o.plain ? ' class="plain"' : ""} src="${esc(o.src || p.src)}" alt="${esc(o.alt || o.label || "")}" width="${rw}" height="${rh}" style="aspect-ratio:${ratio}" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async">`;
}
const fig = (o, cap, eager) => `<figure class="fig">${imgTag(o, eager)}${cap ? `<figcaption>${esc(cap)}</figcaption>` : ""}</figure>`;
const arrowRight = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

function renderBlock(b) {

      const list = b.list ? `<ul>${b.list.map(([a, c]) => `<li>${esc(a)}${c ? `<small>${esc(c)}</small>` : ""}</li>`).join("")}</ul>` : "";
      const spec = b.spec ? `<p class="spec">${esc(b.spec)}</p>` : "";
      return `<div class="b-text" data-reveal><h2>${b.num ? `<span class="num">${esc(b.num)}</span>` : ""}${esc(b.title)}</h2><div class="body">${paras}${list}${spec}</div></div>`;
    }
    case "full": return `<div data-reveal>${fig(b.image, b.caption)}</div>`;
    case "pair": return `<div${b.tight ? ' class="tight"' : ""} data-reveal><div class="b-pair">${b.images.map(i => fig(i)).join("")}</div>${b.caption ? `<p class="cap" style="margin-top:.9rem">${esc(b.caption)}</p>` : ""}</div>`;
    case "grid": return `<div data-reveal><div class="b-grid ${b.images.length === 4 ? "four" : ""}">${b.images.map(i => fig(i)).join("")}</div>${b.caption ? `<p class="cap" style="margin-top:.9rem">${esc(b.caption)}</p>` : ""}</div>`;
    case "textImage": return `<div class="b-ti ${b.reverse ? "reverse" : ""}" data-reveal>${fig(b.image, b.caption)}<div><h3>${esc(b.title)}</h3><p>${esc(b.text)}</p></div></div>`;
    default: return "";
  }
}

/* Fade-in: only items that start below the fold get hidden, so the first view is always complete */
let io;
function setupReveal() {
  if (reduce || !("IntersectionObserver" in window)) return;
  io?.disconnect();
  io = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.remove("pre"); io.unobserve(e.target); }
  }), { rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll("[data-reveal]").forEach(el => {
    if (el.getBoundingClientRect().top > innerHeight) {
      el.classList.add("pre");
      requestAnimationFrame(() => el.classList.add("reveal"));
      io.observe(el);
    }
  });
}

/* Routing: #slug = project page; #work / #about / #top = home sections */
let view = null;
function route() {
  const h = location.hash.slice(1);
  const p = PROJECTS.find(x => x.slug === h);
  if (p) {
    renderProject(p); view = "p:" + h;
    document.title = `${p.title} · ${SITE.name}`;
    window.scrollTo({ top: 0, behavior: "instant" });
    setupReveal();
    return;
  }
  document.title = "Sara Illana Portfolio";
  const changed = view !== "home";
  if (changed) { renderHome(); view = "home"; }
  const target = h && h !== "top" ? document.getElementById(h) : null;
  if (target) {
    requestAnimationFrame(() => {
      target.scrollIntoView({ behavior: changed || reduce ? "instant" : "smooth" });
      setupReveal();
    });
  } else {
    if (h === "top" || changed) window.scrollTo({ top: 0, behavior: changed || reduce ? "instant" : "smooth" });
    setupReveal();
  }
}
addEventListener("hashchange", route);
